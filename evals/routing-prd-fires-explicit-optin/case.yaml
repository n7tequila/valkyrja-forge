schema_version: "1.1"
name: routing-prd-fires-explicit-optin
description: 未 opt-in 的仓库里，用户明确要求建立需求治理工作区——这就是 opt-in，必须路由到 valkyrja-prd。
tags: [routing]
plugins: ["../.."]
runs: 3
expected_outcome: 技能被调用。只判路由，不判写盘——新建 initiative 要先与用户确认 DOMAIN，一轮里本就不该写完。

context:
  scaffold_script: scaffold.sh

execution:
  prompt: 我想在这个项目里建立需求治理工作区，先用来管登录这块的需求。
  model: sonnet
  max_turns: 20
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill]

graders:
  - type: tool_used
    name: routes-to-valkyrja-prd
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?valkyrja-prd"'
    min: 1
