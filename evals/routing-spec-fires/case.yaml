schema_version: "1.1"
name: routing-spec-fires
description: 已有 valkyrja 基线的仓库里，一句随口的进度问询必须路由到 valkyrja-spec。
tags: [smoke, routing]
plugins: ["../.."]
runs: 3
expected_outcome: 技能被调用；本用例只判是否路由，不判路由后做得对不对。

context:
  scaffold_script: scaffold.sh

execution:
  prompt: 看看哪些需求还没做。
  model: sonnet
  max_turns: 25
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill]

graders:
  # 本用例全部 grader 都是 with-only（Skill 类），按 harness 规则此时正常计分。
  - type: tool_used
    name: routes-to-valkyrja-spec
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?valkyrja-spec"'
    min: 1
